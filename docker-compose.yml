include:
  - supabase-config/docker-compose.yml

services:
  orders-service:
    container_name: orders-service
    image: plantio1/orders-service:latest
    ports:
      - "8085:8085"
    restart: unless-stopped
    healthcheck:
      test:
        [
          "CMD",
          "curl",
          "-sSfL",
          "--head",
          "-o",
          "/dev/null",
          "http://localhost:8085/actuator/health"
        ]
      timeout: 60s
      interval: 5s
      retries: 12
    # depends_on:
    #   supabase-pooler:
    #     condition: service_healthy
    networks:
      - plant-network
    env_file: "orders-service/.env"
  
  users-service:
    container_name: users-service
    image: plantio1/users-service:latest
    ports:
      - "8086:8086"
    restart: unless-stopped
    healthcheck:
      test:
        [
          "CMD",
          "curl",
          "-sSfL",
          "--head",
          "-o",
          "/dev/null",
          "http://localhost:8086/actuator/health"
        ]
      timeout: 60s
      interval: 5s
      retries: 12
    # depends_on:
    #   supabase-pooler:
    #     condition: service_healthy
    networks:
      - plant-network
    env_file: "users-service/.env"

  discovery-server:
    container_name: discovery-server
    image: plantio1/discovery-server:latest
    ports:
      - "8761:8761"
    restart: unless-stopped
    healthcheck:
      test:
        [
          "CMD",
          "curl",
          "-v",
          "localhost:8761"
        ]
      timeout: 10s
      interval: 5s
      retries: 3
    networks:
      - plant-network
  
  product-service:
    container_name: product-service
    image: plantio1/product-service:latest
    ports:
      - "8081:8081"
    restart: unless-stopped
    healthcheck:
      test:
        [
          "CMD",
          "curl",
          "-sSfL",
          "--head",
          "-o",
          "/dev/null",
          "http://localhost:8081/actuator/health"
        ]
      timeout: 60s
      interval: 5s
      retries: 12
    # depends_on:
    #   supabase-pooler:
    #     condition: service_healthy
    networks:
      - plant-network
    env_file: "products-service/.env"

  api-gateway:
    container_name: api-gateway
    image: plantio1/api-gateway:latest
    ports:
      - "8080:8080"
    restart: unless-stopped
    healthcheck:
      test:
        [
          "CMD",
          "curl",
          "-v",
          "localhost:8080/products/1"
        ]
      timeout: 10s
      interval: 5s
      retries: 3
    environment:
      SUPABASE_DB_PASSWORD: ${SUPABASE_DB_PASSWORD}
      KEYCLOAK_URL: ${KEYCLOAK_URL}
      KEYCLOAK_ISSUER: ${KEYCLOAK_ISSUER}
    networks:
      - plant-network
    depends_on:
      product-service:
        condition: service_healthy
  frontend:
    container_name: frontend
    image: plantio1/frontend:latest
    ports:
      - "3000:3000"
    restart: unless-stopped
    healthcheck:
      test:
        [
          "CMD",
          "curl",
          "-v",
          "localhost:3000"
        ]
      timeout: 10s
      interval: 5s
      retries: 3
    env_file: "frontend/.env"
    networks:
      - plant-network
    depends_on:
      api-gateway:
        condition: service_healthy
  keycloak-auth:
    container_name: keycloak-auth
    image: quay.io/keycloak/keycloak:26.8.1
    ports:
      - "8090:8080"
      - "8444:8443"
    restart: unless-stopped
    command: start-dev
    environment:
      KC_BOOTSTRAP_ADMIN_USERNAME: ${KEYCLOAK_ADMIN_USERNAME}
      KC_BOOTSTRAP_ADMIN_PASSWORD: ${KEYCLOAK_PASSWORD}
      KC_HOSTNAME: ${KEYCLOAK_URL}
      KC_DB: postgres
      KC_DB_USERNAME: postgres
      KC_DB_PASSWORD: ${SUPABASE_DB_PASSWORD}
      KC_DB_URL: jdbc:postgresql://supabase-db:5432/postgres?currentSchema=keycloak_data
    networks:
      - plant-network



networks:
  plant-network:
    name: plant.io-network

  